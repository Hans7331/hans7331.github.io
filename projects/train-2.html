<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="Taniya's Workout — a private, offline workout tracker.">
  <title>Taniya's Workout</title>
  <style>

    .front .calves.l{left:36%;top:74%;width:11%;height:17%}.front .calves.r{right:36%;top:74%;width:11%;height:17%}

    .back .forearms.l{left:25%;top:38%;width:8%;height:13%;transform:rotate(13deg)}.back .forearms.r{right:25%;top:38%;width:8%;height:13%;transform:rotate(-13deg)}
    .back .lats.l{left:36%;top:25%;width:14%;height:18%;clip-path:polygon(0 0,100% 12%,74% 100%,20% 82%)}.back .lats.r{right:36%;top:25%;width:14%;height:18%;clip-path:polygon(0 12%,100% 0,80% 82%,26% 100%)}
    .back .midBack{left:43%;top:25%;width:14%;height:20%;border-radius:25%}
    .back .glutes.l{left:37%;top:45%;width:14%;height:12%}.back .glutes.r{right:37%;top:45%;width:14%;height:12%}
    .back .hamstrings.l{left:37%;top:56%;width:13%;height:18%}.back .hamstrings.r{right:37%;top:56%;width:13%;height:18%}
    .back .abductors.l{left:34%;top:45%;width:9%;height:11%}.back .abductors.r{right:34%;top:45%;width:9%;height:11%}
    .back .calves.l{left:37%;top:74%;width:11%;height:17%}.back .calves.r{right:37%;top:74%;width:11%;height:17%}
    .legend{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:12px;color:var(--muted);font-size:12px;font-weight:700}

    .text-btn,.outline-btn,.solid-btn{min-height:44px;border-radius:13px;padding:0 14px;font-weight:800;font-size:13px;cursor:pointer}.text-btn{border:0;background:transparent;text-decoration:underline;text-underline-offset:3px}.outline-btn{border:1px solid var(--line);background:white}.solid-btn{border:1px solid var(--ink);background:var(--ink);color:white}
    .form-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:1px solid var(--line);border-radius:13px;padding:0 13px;text-decoration:none;background:white;font-size:13px;font-weight:800}

    .check-card{display:grid;grid-template-columns:1fr 50px;align-items:center;min-height:70px;padding:10px 8px 10px 10px}.check-info{display:block;width:100%;border:0;background:transparent;text-align:left;padding:7px;cursor:pointer}.check-card .form-link{border:0;padding:0 7px;min-height:auto;background:transparent;color:var(--muted);font-size:11px;margin-top:1px}

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>TANIYA'S WORKOUT</div>
      <div class="privacy-chip">Saved on this device</div>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-btn active" data-action="nav" data-view="today"><span class="nav-icon" aria-hidden="true">●</span><span>Today</span></button>
      <button class="nav-btn" data-action="nav" data-view="schedule"><span class="nav-icon" aria-hidden="true">▦</span><span>Schedule</span></button>
      <button class="nav-btn" data-action="nav" data-view="progress"><span class="nav-icon" aria-hidden="true">↗</span><span>Progress</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="import-file" class="sr-only" type="file" accept="application/json,.json">
  <noscript><p style="padding:24px">Train requires JavaScript to save workouts and draw progress.</p></noscript>
  <script>
  (() => {
    'use strict';

    const STORAGE_KEY = 'taniya-workout-data-v2';

    function filteredPoints(points){if(state.filter==='all')return points;const days=state.filter==='1m'?31:93;const cutoff=addDays(new Date(),-days);return points.filter(p=>parseDate(p.date)>=cutoff)}

    function renderProgress(){

    });
    document.getElementById('import-file').addEventListener('change',async event=>{
      const file=event.target.files?.[0];event.target.value='';if(!file)return;
      try{const parsed=JSON.parse(await file.text());if(parsed?.schemaVersion!==1||parsed.trackerId!==TRACKER_ID||!parsed.sessions||typeof parsed.sessions!=='object'||Array.isArray(parsed.sessions))throw new Error('Invalid backup');if(!confirm(`Replace current history with ${Object.keys(parsed.sessions).length} saved sessions?`))return;data=parsed;saveData();render();toast('Workout history imported.')}catch(err){toast("That file is not a valid Taniya's Workout backup.")}
    });
    function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`taniya-workout-backup-${isoDate(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded.')}
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.view==='today'&&!state.activeDate)render()});

    render();
  })();
  </script>
</body>
</html>
