<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swedish Words</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
    color: #111111;
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-y;
  }

  body {
    display: grid;
    place-items: center;
    box-sizing: border-box;
    padding: calc(108px + env(safe-area-inset-top)) 0 calc(96px + env(safe-area-inset-bottom));
    height: 100dvh;
  }

  #topbar {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));
    z-index: 10;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
  }

  #status {
    font-size: 12px;
    line-height: 1.4;
    color: #666;
    pointer-events: none;
  }

  #status .mastered {
    color: #2e7d32;
  }

  #controls {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    pointer-events: auto;
  }

  #deckSelector {
    max-width: 190px;
    border: 0;
    border-radius: 10px;
    padding: 8px 10px;
    background: #f3f3f3;
    color: #222;
    font: inherit;
    font-size: 14px;
    outline: none;
    cursor: pointer;
  }

  #hint {
    font-size: 11px;
    line-height: 1.35;
    color: #777;
    text-align: right;
    max-width: 240px;
  }

  #card {
    width: min(90vw, 760px);
    min-height: 0;
    max-height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }

  #word {
    font-size: clamp(42px, 10vw, 86px);
    font-weight: 700;
    line-height: 1.05;
    overflow-wrap: anywhere;
  }

  #meaning {
    margin-top: 28px;
    font-size: clamp(24px, 5vw, 42px);
    line-height: 1.25;
    opacity: 0;
    transition: opacity 120ms ease;
  }

  #meaning.show {
    opacity: 1;
  }

  .meaning-base {
    font-weight: 600;
  }

  .meaning-form {
    margin-top: 8px;
    font-size: 0.62em;
    line-height: 1.3;
    opacity: 0.72;
  }

  #ratings {
    position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  #ratings button {
    flex: 1;
    max-width: 180px;
    min-height: 52px;
    padding: 12px 8px;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: #f3f3f3;
    color: #222;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }

  #ratings button:last-child {
    background: #e8f5e9;
    border-color: #a5d6a7;
    color: #256428;
  }

  #ratings button:disabled {
    opacity: 0.45;
    cursor: default;
  }

  #ratings button:focus-visible {
    outline: 3px solid #1565c0;
    outline-offset: 3px;
  }

  @media (max-height: 500px) {
    body { padding-top: calc(86px + env(safe-area-inset-top)); }
    #hint { display: none; }
    #word { font-size: 36px; }
    #meaning { margin-top: 12px; font-size: 24px; }
    #card { padding: 12px; }
  }

  #done {
    display: none;
    text-align: center;
    padding: 24px;
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 650;
  }

  #done.show {
    display: block;
  }
</style>
</head>
<body>
  <div id="topbar">
    <div id="status"></div>

    <div id="controls">
      <select id="deckSelector" aria-label="Choose dictionary">
        <option value="verbs">My Words</option>
        <option value="core">A1–B1 core</option>
      </select>
      <div id="hint">
        Tap card / Space = show or hide<br>
        Swipe / arrows = next or previous<br>
        1 = not sure · 2 = sure · 3 = mastered
      </div>
    </div>
  </div>

  <main id="card" aria-label="Swedish flashcard">
    <div id="word"></div>
    <div id="meaning"></div>
    <div id="done">All mastered ✓</div>
  </main>

  <nav id="ratings" aria-label="Rate this word">
    <button type="button" data-rating="1">1 · Not sure</button>
    <button type="button" data-rating="2">2 · Sure</button>
    <button type="button" data-rating="3">3 · Mastered</button>
  </nav>

<script>
/*
  My Words is embedded in this file.
  A1–B1 core is downloaded once, then cached locally when the browser permits it.
  Study progress is stored in localStorage on this browser/device.
*/

const myVerbs = [["Anteckna", "take notes / write down"], ["Arbeta", "work"], ["Bada", "bathe / swim"], ["Banta", "diet / lose weight"], ["Berätta", "tell / narrate"], ["Betala", "pay"], ["Betona", "emphasize / stress"], ["Bilda", "form / create"], ["Blinka", "blink"], ["Bädda", "make the bed"], ["Börja", "begin / start"], ["Cykla", "cycle / ride a bike"], ["Dansa", "dance"], ["Deklarera", "declare / file a tax return"], ["Dela", "share / divide"], ["Diska", "wash the dishes"], ["Diskutera", "discuss"], ["Duscha", "shower"], ["Fastna", "get stuck"], ["Fiska", "fish"], ["Flytta", "move"], ["Fråga", "ask"], ["Förklara", "explain"], ["Förlova (sig)", "get engaged"], ["Gratulera", "congratulate"], ["Gräla", "argue / quarrel"], ["Hata", "hate"], ["Hosta", "cough"], ["Hälsa (på)", "greet / visit"], ["Hämta", "fetch / pick up"], ["Intervjua", "interview"], ["Kasta", "throw"], ["Klara (sig)", "manage / cope"], ["Kontrollera", "check / control"], ["Krama", "hug"], ["Laga", "repair / cook"], ["Likna", "resemble"], ["Ljusna", "become lighter / brighten"], ["Lukta", "smell"], ["Lyssna", "listen"], ["Låna", "borrow / lend"], ["Längta", "long for / miss"], ["Meddela", "inform / notify"], ["Mena", "mean"], ["Närma (sig)", "approach / get closer"], ["Parkera", "park"], ["Passa", "fit / suit / look after"], ["Posta", "post / mail"], ["Promenera", "walk / take a walk"], ["Regna", "rain"], ["Rita", "draw"], ["Ropa", "shout / call out"], ["Räkna", "count / calculate"], ["Sakna", "miss / lack"], ["Samarbeta", "cooperate"], ["Samla", "collect / gather"], ["Servera", "serve"], ["Simma", "swim"], ["Skada", "injure / damage"], ["Skicka", "send"], ["Sluta", "stop / end / quit"], ["Smaka", "taste"], ["Snöa", "snow"], ["Spela", "play"], ["Stanna", "stay / stop"], ["Studera", "study"], ["Svara", "answer / reply"], ["Somna", "fall asleep"], ["Städa", "clean / tidy"], ["Tacka", "thank"], ["Tala", "speak"], ["Titta", "look / watch"], ["Träffa", "meet / hit"], ["Tvätta", "wash"], ["Vakna", "wake up"], ["Vänta", "wait"], ["Växla", "change / exchange / shift"], ["Älska", "love"], ["Önska", "wish"], ["Öppna", "open"], ["Anmäla", "report / register / sign up"], ["Använda", "use"], ["Behöva", "need"], ["Beställa", "order / book"], ["Bestämma", "decide / determine"], ["Bygga", "build"], ["Böja", "bend"], ["Drömma", "dream"], ["Fylla", "fill"], ["Föda", "give birth / feed"], ["Följa", "follow / accompany"], ["Glömma", "forget"], ["Gräva", "dig"], ["Gömma", "hide"], ["Hyra", "rent / hire"], ["Höra", "hear"], ["Hända", "happen"], ["Köra", "drive"], ["Lära", "teach / learn"], ["Känna", "feel / know / recognize"], ["Ringa", "call / ring"], ["Sjukanmäla (sig)", "report oneself sick / call in sick"], ["Skilja (sig)", "separate / get divorced"], ["Slänga", "throw away / toss"], ["Smälla", "bang / slam"], ["Ställa", "put / place / set"], ["Stänga", "close / shut"], ["Tända", "light / turn on"], ["Ärva", "inherit"], ["Besöka", "visit"], ["Blåsa", "blow"], ["Byta", "change / exchange"], ["Gifta (sig)", "get married"], ["Hjälpa", "help"], ["Klippa", "cut / clip"], ["Köpa", "buy"], ["Leka", "play"], ["Lyfta", "lift"], ["Läsa", "read / study"], ["Lösa", "solve"], ["Möta", "meet"], ["Resa", "travel / raise"], ["Röka", "smoke"], ["Sköta", "manage / take care of"], ["Släcka", "extinguish / turn off"], ["Släppa", "let go / release"], ["Steka", "fry"], ["Söka", "search / apply"], ["Trycka", "press / print"], ["Tycka", "think / have an opinion"], ["Tänka", "think / intend"], ["Upptäcka", "discover"], ["Väcka", "wake someone up"], ["Värka", "ache"], ["Åka", "go / travel / ride"], ["Bo", "live / reside"], ["Klä", "dress / clothe"], ["Bre", "spread"], ["Bry (sig om)", "care about"], ["Må", "feel / be"], ["Strö", "sprinkle"], ["Sy", "sew"], ["Fly", "flee"], ["Gry", "dawn / begin to get light"], ["Spy", "vomit / throw up"], ["Gny", "whine / whimper"], ["Tro", "believe / think"], ["Glo", "stare"], ["Så", "sow"], ["Spå", "predict / tell fortunes"], ["Bli", "become"], ["Bita", "bite"], ["Skina", "shine"], ["Skriva", "write"], ["Skrika", "scream / shout"], ["Stiga", "rise / step"], ["Dricka", "drink"], ["Brinna", "burn"], ["Finna", "find"], ["Försvinna", "disappear"], ["Hinna", "have time / manage to"], ["Rinna", "flow / run"], ["Sitta", "sit"], ["Slippa", "avoid / not have to"], ["Springa", "run"], ["Vinna", "win"], ["Bryta", "break"], ["Flyga", "fly"], ["Frysa", "freeze / feel cold"], ["Knyta", "tie / knot"], ["Snyta", "blow one's nose"], ["Stryka", "iron / stroke / cross out"], ["Lägga", "put / lay"], ["Sätta", "put / set / seat"], ["Välja", "choose"], ["Vänja", "accustom / get used to"], ["Be", "ask / pray"], ["Bjuda", "invite / offer / treat"], ["Bära", "carry / wear"], ["Falla", "fall"], ["Få", "get / receive / be allowed to"], ["Ge", "give"], ["Gråta", "cry / weep"], ["Gå", "go / walk"], ["Göra", "do / make"], ["Ha", "have"], ["Komma", "come"], ["Kunna", "can / be able to / know how to"], ["Ligga", "lie / be located"], ["Måste", "must / have to"], ["Se", "see"], ["Skola", "shall / be going to"], ["Skära", "cut / slice"], ["Slå", "hit / beat"], ["Sova", "sleep"], ["Stjäla", "steal"], ["Stå", "stand"], ["Säga", "say / tell"], ["Ta", "take"], ["Vara", "be"], ["Veta", "know"], ["Vilja", "want"], ["Äta", "eat"]];

const KELLY_URLS = [
  "https://cdn.jsdelivr.net/gh/kotoshu/frequency-list-kelly@main/data/sv.json",
  "https://raw.githubusercontent.com/kotoshu/frequency-list-kelly/main/data/sv.json"
];

const FOLKETS_URLS = [
  "https://cdn.jsdelivr.net/gh/antonlisq/convert-dict@main/folkets_sv_en_public.json",
  "https://raw.githubusercontent.com/antonlisq/convert-dict/main/folkets_sv_en_public.json"
];

const CORE_CACHE_KEY = "swedish_a1_b1_core_3000_v1";
const PROGRESS_KEY = "swedish_flashcard_progress_v2";

let decks = { verbs: myVerbs };
let currentDeck = "verbs";
let order = [];
let pos = 0;
let revealed = false;
let loadingCore = false;
let folketsDictionary = null;
let loadingDictionary = null;

const selector = document.getElementById("deckSelector");
const word = document.getElementById("word");
const meaning = document.getElementById("meaning");
const done = document.getElementById("done");
const card = document.getElementById("card");
const status = document.getElementById("status");
const ratingButtons = document.querySelectorAll("#ratings button");

function updateRatingButtons(disabled = !currentItem()) {
  ratingButtons.forEach(button => { button.disabled = disabled; });
}

ratingButtons.forEach(button => {
  button.addEventListener("click", () => {
    rateCurrent(Number(button.dataset.rating));
    button.blur();
  });
});

function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    if (!raw) return { verbs: {}, core: {} };
    const p = JSON.parse(raw);
    return {
      verbs: p.verbs || {},
      core: p.core || {}
    };
  } catch (_) {
    return { verbs: {}, core: {} };
  }
}

let progress = loadProgress();

function saveProgress() {
  try {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  } catch (_) {}
}

function itemKey(item) {
  return String(item[0] || "").trim().toLowerCase();
}

function getRating(deckName, item) {
  return Number((progress[deckName] || {})[itemKey(item)] || 0);
}

function setRating(deckName, item, rating) {
  if (!progress[deckName]) progress[deckName] = {};
  progress[deckName][itemKey(item)] = rating;
  saveProgress();
}

function activeIndexes(deckName) {
  const deck = decks[deckName] || [];
  return deck
    .map((item, i) => ({ item, i }))
    .filter(x => getRating(deckName, x.item) !== 3)
    .map(x => x.i);
}

function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function counts(deckName) {
  const deck = decks[deckName] || [];
  let mastered = 0;
  for (const item of deck) {
    if (getRating(deckName, item) === 3) mastered++;
  }
  return {
    total: deck.length,
    mastered,
    remaining: deck.length - mastered
  };
}

function updateStatus() {
  const c = counts(currentDeck);
  status.innerHTML =
    `Total: ${c.total}<br>` +
    `Remaining: ${c.remaining}<br>` +
    `<span class="mastered">Mastered: ${c.mastered}</span>`;

  const label = currentDeck === "verbs" ? "My Words" : "A1–B1 core";
  const opt = selector.querySelector(`option[value="${currentDeck}"]`);
  if (opt) opt.textContent = `${label} (${c.total})`;
}

function resetOrder() {
  order = shuffle(activeIndexes(currentDeck));
  pos = 0;
}

function setDeck(name) {
  currentDeck = name;
  resetOrder();
  render();
}

function currentItem() {
  const deck = decks[currentDeck] || [];
  if (!order.length) return null;
  return deck[order[pos]] || null;
}

function render() {
  updateStatus();
  updateRatingButtons();

  const item = currentItem();

  if (!item) {
    word.textContent = "";
    meaning.textContent = "";
    meaning.classList.remove("show");
    done.classList.add("show");
    revealed = false;
    return;
  }

  done.classList.remove("show");
  word.textContent = item[0];
  meaning.textContent = item[1];
  revealed = false;
  meaning.classList.remove("show");
}

async function ensureDictionary() {
  if (folketsDictionary) return folketsDictionary;
  if (loadingDictionary) return loadingDictionary;

  loadingDictionary = fetchJSONWithFallback(FOLKETS_URLS)
    .then(data => {
      folketsDictionary = data;
      return data;
    })
    .catch(() => null)
    .finally(() => { loadingDictionary = null; });

  return loadingDictionary;
}

function getDictionaryEntry(sw) {
  if (!folketsDictionary) return null;
  for (const form of lookupForms(sw)) {
    if (Object.prototype.hasOwnProperty.call(folketsDictionary, form)) {
      return folketsDictionary[form];
    }
  }
  return null;
}

function getInflections(entry) {
  if (!entry) return [];
  const candidates = Array.isArray(entry) ? entry : [entry];

  for (const candidate of candidates) {
    if (!candidate || typeof candidate !== "object") continue;
    const values = Array.isArray(candidate.i) ? candidate.i : [];
    const forms = values
      .map(v => typeof v === "string" ? v : (v && typeof v.v === "string" ? v.v : ""))
      .map(v => v.trim())
      .filter(Boolean);
    if (forms.length) return forms;
  }
  return [];
}

function verbRevealHTML(item) {
  const swedish = item[0];
  const english = item[1];
  const entry = getDictionaryEntry(swedish);
  const forms = getInflections(entry);

  const rows = [`<div class="meaning-base">${escapeHTML(swedish.toLowerCase())} — ${escapeHTML(english)}</div>`];
  const labels = [
    ["present", "present of"],
    ["past", "past of"],
    ["perfect / supine", "perfect of"]
  ];

  forms.slice(0, 3).forEach((form, i) => {
    const label = labels[i] || [`form ${i + 1}`, "form of"];
    rows.push(`<div class="meaning-form">${escapeHTML(form)} — ${label[1]} “${escapeHTML(english)}” (${label[0]})</div>`);
  });

  return rows.join("");
}

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function reveal() {
  const item = currentItem();
  if (!item) return;

  revealed = !revealed;
  meaning.classList.toggle("show", revealed);
  if (!revealed) return;

  if (currentDeck !== "verbs") {
    meaning.textContent = item[1];
    return;
  }

  meaning.innerHTML = verbRevealHTML(item);
  await ensureDictionary();

  // Ignore a result if the user hid the answer, changed cards, or switched decks.
  if (!revealed || currentDeck !== "verbs" || currentItem() !== item) return;
  meaning.innerHTML = verbRevealHTML(item);
}

function next() {
  if (!order.length) return;
  pos++;
  if (pos >= order.length) {
    resetOrder();
  }
  render();
}

function prev() {
  if (!order.length) return;
  pos = (pos - 1 + order.length) % order.length;
  render();
}

function rateCurrent(rating) {
  const item = currentItem();
  if (!item) return;

  setRating(currentDeck, item, rating);

  if (rating === 3) {
    order.splice(pos, 1);

    if (!order.length) {
      render();
      return;
    }

    if (pos >= order.length) pos = 0;
    render();
  } else {
    next();
  }
}

async function fetchJSONWithFallback(urls) {
  let lastError;
  for (const url of urls) {
    try {
      const response = await fetch(url, { cache: "force-cache" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      return await response.json();
    } catch (err) {
      lastError = err;
    }
  }
  throw lastError || new Error("Could not load data");
}

function cleanKellyWord(value) {
  return String(value || "")
    .replace(/\s*\([^)]*\)\s*/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function lookupForms(wordValue) {
  const base = cleanKellyWord(wordValue).toLowerCase();
  const forms = [base];

  if (base.startsWith("att ")) forms.push(base.slice(4));
  if (base.startsWith("en ")) forms.push(base.slice(3));
  if (base.startsWith("ett ")) forms.push(base.slice(4));

  const slash = base.split("/")[0].trim();
  if (slash && !forms.includes(slash)) forms.push(slash);

  return [...new Set(forms.filter(Boolean))];
}

function translationsFromEntry(entry) {
  const found = [];

  function collect(x) {
    if (!x) return;

    if (Array.isArray(x)) {
      x.forEach(collect);
      return;
    }

    if (typeof x === "object") {
      const t = x.t;
      if (typeof t === "string") found.push(t);
      else if (Array.isArray(t)) {
        for (const item of t) {
          if (typeof item === "string") found.push(item);
          else if (item && typeof item === "object" && typeof item.t === "string") {
            found.push(item.t);
          }
        }
      }
    }
  }

  collect(entry);

  const cleaned = [];
  const seen = new Set();

  for (const text of found) {
    const v = String(text).replace(/\s+/g, " ").trim();
    const key = v.toLowerCase();

    if (v && !seen.has(key)) {
      seen.add(key);
      cleaned.push(v);
    }

    if (cleaned.length >= 3) break;
  }

  return cleaned;
}

function makeCoreDeck(kelly, dictionary) {
  let entries = [];

  if (Array.isArray(kelly.full_list)) entries = kelly.full_list;
  else if (Array.isArray(kelly)) entries = kelly;

  entries = entries
    .filter(item => {
      const level = String(item.cefr || item.cefr_level || "").toUpperCase();
      return level === "A1" || level === "A2" || level === "B1";
    })
    .sort((a, b) =>
      Number(a.rank || a.id || 999999) -
      Number(b.rank || b.id || 999999)
    );

  const result = [];
  const seenWords = new Set();

  for (const item of entries) {
    const original = cleanKellyWord(item.word || item.lemma || item.item);
    if (!original) continue;

    const display = original.toLowerCase();
    if (seenWords.has(display)) continue;

    let translations = [];

    for (const form of lookupForms(original)) {
      if (dictionary && Object.prototype.hasOwnProperty.call(dictionary, form)) {
        translations = translationsFromEntry(dictionary[form]);
        if (translations.length) break;
      }
    }

    if (!translations.length) continue;

    seenWords.add(display);
    result.push([display, translations.join(" / ")]);

    if (result.length >= 3000) break;
  }

  return result;
}

async function loadCoreDeck() {
  if (decks.core && decks.core.length) return decks.core;
  if (loadingCore) return null;

  loadingCore = true;

  try {
    try {
      const cached = localStorage.getItem(CORE_CACHE_KEY);
      if (cached) {
        const parsed = JSON.parse(cached);
        if (Array.isArray(parsed) && parsed.length >= 1000) {
          decks.core = parsed;
          return decks.core;
        }
      }
    } catch (_) {}

    updateRatingButtons(true);
    word.textContent = "Loading…";
    meaning.textContent = "";
    done.classList.remove("show");

    const [kelly, dictionary] = await Promise.all([
      fetchJSONWithFallback(KELLY_URLS),
      ensureDictionary()
    ]);

    const core = makeCoreDeck(kelly, dictionary);

    if (!core.length) {
      throw new Error("No matching learner vocabulary was found.");
    }

    decks.core = core;

    try {
      localStorage.setItem(CORE_CACHE_KEY, JSON.stringify(core));
    } catch (_) {}

    return core;
  } finally {
    loadingCore = false;
  }
}

selector.addEventListener("change", async () => {
  const chosen = selector.value;

  if (chosen === "verbs") {
    setDeck("verbs");
    return;
  }

  try {
    const core = await loadCoreDeck();
    if (core && core.length) {
      setDeck("core");
    }
  } catch (err) {
    currentDeck = "core";
    order = [];
    updateRatingButtons(true);
    word.textContent = "Couldn’t load";
    meaning.textContent = "Open this page with an internet connection and try again.";
    meaning.classList.add("show");
    done.classList.remove("show");
    updateStatus();
  }
});

card.addEventListener("click", () => {
  if (dragged) {
    dragged = false;
    return;
  }
  reveal();
});

let startX = null;
let startY = null;

card.addEventListener("touchstart", e => {
  const t = e.changedTouches[0];
  startX = t.clientX;
  startY = t.clientY;
}, { passive: true });

card.addEventListener("touchend", e => {
  if (startX === null) return;

  const t = e.changedTouches[0];
  const dx = t.clientX - startX;
  const dy = t.clientY - startY;

  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
    // Cancel the synthetic tap after a swipe so the new answer stays hidden.
    e.preventDefault();
    dx < 0 ? next() : prev();
  }

  startX = null;
  startY = null;
}, { passive: false });

card.addEventListener("touchcancel", () => {
  startX = null;
  startY = null;
});

let mouseDownX = null;
let dragged = false;

card.addEventListener("mousedown", e => {
  mouseDownX = e.clientX;
  dragged = false;
});

card.addEventListener("mousemove", e => {
  if (mouseDownX !== null && Math.abs(e.clientX - mouseDownX) > 12) {
    dragged = true;
  }
});

card.addEventListener("mouseup", e => {
  if (mouseDownX === null) return;

  const dx = e.clientX - mouseDownX;

  if (Math.abs(dx) > 70) {
    dx < 0 ? next() : prev();
  }

  mouseDownX = null;
});

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") {
    next();
  } else if (e.key === "ArrowLeft") {
    prev();
  } else if (e.key === " ") {
    e.preventDefault();
    if (!e.repeat) reveal();
  } else if (e.key === "1") {
    e.preventDefault();
    rateCurrent(1);
  } else if (e.key === "2") {
    e.preventDefault();
    rateCurrent(2);
  } else if (e.key === "3") {
    e.preventDefault();
    rateCurrent(3);
  }
});

setDeck("verbs");
ensureDictionary();
</script>
</body>
