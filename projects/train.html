<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="Train — a private, offline workout tracker.">
  <title>Train — Workout Tracker</title>
  <style>
    :root {
      --bg:#f4f5f2; --surface:#fff; --surface-2:#f0f1ed; --ink:#151715;
      --muted:#6e736d; --line:#dedfd9; --accent:#f13e5b; --accent-dark:#ba1835;
      --mint:#59d6a1; --mint-dark:#176b4d; --lime:#e8fa74; --warning:#a55800;
      --shadow:0 12px 32px rgba(20,23,20,.08); --shadow-sm:0 4px 14px rgba(20,23,20,.06);
      --r-xl:28px; --r-lg:21px; --r-md:15px; --nav-h:76px;
    }
    *{box-sizing:border-box}
    html{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
    body{margin:0;min-width:280px;background:var(--bg)}
    button,input,select{font:inherit}
    button,a,label,input,select{-webkit-tap-highlight-color:transparent}
    button{color:inherit}
    a{color:inherit}
    .app{min-height:100dvh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 22px)}
    .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 max(16px,env(safe-area-inset-left));background:rgba(244,245,242,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(222,223,217,.75)}
    .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;letter-spacing:-.04em}
    .brand-mark{width:25px;height:25px;border-radius:8px 8px 12px 12px;background:var(--accent);position:relative;transform:rotate(4deg)}
    .brand-mark:after{content:"";position:absolute;inset:6px 7px 4px;border-radius:50% 50% 42% 42%;border:2px solid white}
    .privacy-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:750;color:var(--muted)}
    .privacy-chip:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint-dark)}
    main{width:min(100%,760px);margin:0 auto;padding:18px 16px 40px}
    .view{animation:fade .22s ease-out}
    @keyframes fade{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
    .eyebrow{margin:0 0 7px;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dark)}
    h1,h2,h3,p{margin-top:0}
    h1{margin-bottom:8px;font-size:clamp(30px,9vw,46px);line-height:.98;letter-spacing:-.055em}
    h2{font-size:24px;line-height:1.08;letter-spacing:-.04em}
    h3{font-size:17px;letter-spacing:-.025em}
    .subtle{color:var(--muted);line-height:1.5}
    .hero{position:relative;overflow:hidden;background:var(--ink);color:white;border-radius:var(--r-xl);padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
    .hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-75px;background:var(--lime);opacity:.92}
    .hero>*{position:relative;z-index:1}
    .hero .eyebrow{color:var(--lime)}
    .hero .date{margin-bottom:20px;color:#bdc1bb;font-size:14px;font-weight:650}
    .progress-line{height:7px;border-radius:99px;background:#363a36;overflow:hidden;margin-top:12px}
    .progress-line>span{display:block;height:100%;border-radius:inherit;background:var(--lime);transition:width .25s ease}
    .progress-copy{display:flex;justify-content:space-between;margin-top:8px;color:#d7dad5;font-size:12px;font-weight:700}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:28px 2px 12px}
    .section-head h2{margin:0}
    .section-head p{margin:0;font-size:13px;color:var(--muted)}
    .muscle-card{padding:16px;margin-bottom:14px}
    .muscle-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .muscle-card-head h2{margin:0;font-size:19px}
    .segmented{display:flex;background:var(--surface-2);padding:3px;border-radius:999px}
    .segmented button{border:0;background:transparent;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer}
    .segmented button.active{background:var(--ink);color:#fff}
    .body-stage{position:relative;width:min(72%,300px);margin:0 auto;aspect-ratio:736/1452;overflow:hidden;border-radius:20px;background:#e7edf2}
    .body-stage.back{aspect-ratio:886/1774}
    .body-stage.hidden{display:none}
    .body-stage img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(.96);opacity:.95}
    .spot{position:absolute;opacity:0;pointer-events:none;background:var(--accent);border:1px solid rgba(117,4,29,.5);mix-blend-mode:multiply;transition:opacity .18s ease}
    .spot.primary{opacity:.76}.spot.secondary{opacity:.64;background:var(--mint);border-color:rgba(11,86,56,.48)}
    .spot.round{border-radius:50%}.spot.soft{border-radius:45%}
    /* front muscle hotspots */
    .front .chest.l{left:30%;top:25%;width:19%;height:9%}.front .chest.r{left:51%;top:25%;width:19%;height:9%}
    .front .shouldersFront.l{left:20%;top:23%;width:13%;height:10%}.front .shouldersFront.r{right:20%;top:23%;width:13%;height:10%}
    .front .shouldersSide.l{left:17%;top:23%;width:13%;height:11%}.front .shouldersSide.r{right:17%;top:23%;width:13%;height:11%}
    .front .biceps.l{left:18%;top:29%;width:12%;height:11%;transform:rotate(14deg)}.front .biceps.r{right:18%;top:29%;width:12%;height:11%;transform:rotate(-14deg)}
    .front .triceps.l{left:17%;top:30%;width:10%;height:10%}.front .triceps.r{right:17%;top:30%;width:10%;height:10%}
    .front .forearms.l{left:12%;top:37%;width:11%;height:13%;transform:rotate(18deg)}.front .forearms.r{right:12%;top:37%;width:11%;height:13%;transform:rotate(-18deg)}
    .front .abs{left:38%;top:32%;width:24%;height:18%;border-radius:38%}
    .front .obliques.l{left:30%;top:34%;width:11%;height:16%;transform:rotate(8deg)}.front .obliques.r{right:30%;top:34%;width:11%;height:16%;transform:rotate(-8deg)}
    .front .hipFlexors.l{left:37%;top:49%;width:11%;height:7%}.front .hipFlexors.r{right:37%;top:49%;width:11%;height:7%}
    .front .quads.l{left:30%;top:53%;width:17%;height:18%}.front .quads.r{right:30%;top:53%;width:17%;height:18%}
    .front .adductors.l{left:40%;top:53%;width:9%;height:18%}.front .adductors.r{right:40%;top:53%;width:9%;height:18%}
    .front .abductors.l{left:27%;top:52%;width:10%;height:14%}.front .abductors.r{right:27%;top:52%;width:10%;height:14%}
    .front .calves.l{left:31%;top:73%;width:13%;height:17%}.front .calves.r{right:31%;top:73%;width:13%;height:17%}
    /* rear muscle hotspots */
    .back .traps{left:34%;top:14%;width:32%;height:18%;clip-path:polygon(50% 0,100% 30%,68% 100%,50% 82%,32% 100%,0 30%)}
    .back .shouldersRear.l{left:22%;top:20%;width:17%;height:11%}.back .shouldersRear.r{right:22%;top:20%;width:17%;height:11%}
    .back .shouldersSide.l{left:20%;top:20%;width:15%;height:11%}.back .shouldersSide.r{right:20%;top:20%;width:15%;height:11%}
    .back .triceps.l{left:18%;top:28%;width:12%;height:13%;transform:rotate(13deg)}.back .triceps.r{right:18%;top:28%;width:12%;height:13%;transform:rotate(-13deg)}
    .back .forearms.l{left:12%;top:38%;width:11%;height:13%;transform:rotate(20deg)}.back .forearms.r{right:12%;top:38%;width:11%;height:13%;transform:rotate(-20deg)}
    .back .lats.l{left:30%;top:25%;width:20%;height:18%;clip-path:polygon(0 0,100% 12%,74% 100%,20% 82%)}.back .lats.r{right:30%;top:25%;width:20%;height:18%;clip-path:polygon(0 12%,100% 0,80% 82%,26% 100%)}
    .back .midBack{left:40%;top:24%;width:20%;height:20%;border-radius:25%}
    .back .glutes.l{left:34%;top:45%;width:17%;height:11%}.back .glutes.r{right:34%;top:45%;width:17%;height:11%}
    .back .hamstrings.l{left:34%;top:55%;width:16%;height:18%}.back .hamstrings.r{right:34%;top:55%;width:16%;height:18%}
    .back .abductors.l{left:28%;top:45%;width:12%;height:11%}.back .abductors.r{right:28%;top:45%;width:12%;height:11%}
    .back .calves.l{left:34%;top:73%;width:14%;height:17%}.back .calves.r{right:34%;top:73%;width:14%;height:17%}
    .legend{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:12px;color:var(--muted);font-size:12px;font-weight:700}
    .legend span{display:flex;align-items:center;gap:6px}.legend i{display:block;width:10px;height:10px;border-radius:50%;background:var(--accent)}.legend span:nth-child(2) i{background:var(--mint)}
    .muscle-description{text-align:center;margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
    .exercise-list{display:grid;gap:10px}
    .exercise-card{overflow:hidden;transition:border-color .2s,background .2s,box-shadow .2s}
    .exercise-card.expanded{border-color:#aeb1aa;box-shadow:var(--shadow)}
    .exercise-card.done{background:#effaf4;border-color:#cce9da}
    .exercise-summary{width:100%;min-height:76px;border:0;background:transparent;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;padding:15px 15px 15px 17px;cursor:pointer}
    .exercise-name{display:block;font-size:16px;font-weight:850;letter-spacing:-.025em;margin-bottom:5px}
    .exercise-meta{font-size:12px;color:var(--muted);font-weight:650}
    .status-ring{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-left:12px;font-weight:900;color:transparent;transition:.2s}
    .done .status-ring{background:var(--mint-dark);border-color:var(--mint-dark);color:white}
    .exercise-details{border-top:1px solid var(--line);padding:15px 16px 17px;background:rgba(255,255,255,.66)}
    .set-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .set-toolbar strong{font-size:13px}.stepper{display:flex;align-items:center;background:var(--surface-2);border-radius:999px;padding:3px}
    .stepper button{width:40px;height:40px;border:0;border-radius:50%;background:transparent;font-size:21px;cursor:pointer}.stepper output{min-width:32px;text-align:center;font-weight:900}
    .set-list{display:grid;gap:8px}
    .set-row{display:grid;grid-template-columns:54px minmax(0,1fr) 50px;align-items:center;gap:8px;background:var(--surface-2);border-radius:var(--r-md);padding:7px 7px 7px 13px}
    .set-label{font-size:12px;font-weight:850;color:var(--muted)}
    .weight-wrap{position:relative}.weight-wrap input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:white;padding:0 42px 0 12px;font-size:17px;font-weight:800;outline:0}.weight-wrap input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(21,23,21,.09)}.weight-wrap span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);font-weight:800;pointer-events:none}
    .check-control{display:grid;place-items:center;width:48px;height:48px;position:relative}.check-control input{position:absolute;opacity:0}.check-box{width:29px;height:29px;border:2px solid #b8bbb5;border-radius:9px;background:white;display:grid;place-items:center;color:transparent;font-weight:950}.check-control input:focus-visible+.check-box{outline:3px solid rgba(241,62,91,.3);outline-offset:2px}.check-control input:checked+.check-box{background:var(--mint-dark);border-color:var(--mint-dark);color:white}
    .detail-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
    .text-btn,.outline-btn,.solid-btn{min-height:44px;border-radius:13px;padding:0 14px;font-weight:800;font-size:13px;cursor:pointer}.text-btn{border:0;background:transparent;text-decoration:underline;text-underline-offset:3px}.outline-btn{border:1px solid var(--line);background:white}.solid-btn{border:1px solid var(--ink);background:var(--ink);color:white}
    .form-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:1px solid var(--line);border-radius:13px;padding:0 13px;text-decoration:none;background:white;font-size:13px;font-weight:800}
    .empty-sets{padding:14px;border:1px dashed #c8cbc4;border-radius:14px;text-align:center;color:var(--muted);font-size:13px}
    .check-card{display:grid;grid-template-columns:1fr 50px;align-items:center;min-height:70px;padding:10px 8px 10px 10px}.check-info{display:block;width:100%;border:0;background:transparent;text-align:left;padding:7px;cursor:pointer}.check-card .form-link{border:0;padding:0 7px;min-height:auto;background:transparent;color:var(--muted);font-size:11px;margin-top:1px}
    .success-card{padding:22px;background:var(--lime);border:0;margin-top:14px}.success-card h2{margin-bottom:6px}.success-card p{margin:0;color:#4b4f38}
    .page-title{display:flex;align-items:start;justify-content:space-between;gap:14px;margin:8px 2px 18px}.page-title h1{font-size:38px;margin-bottom:5px}.page-title p{margin:0}
    .week-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.week-controls button{width:44px;height:44px;border:1px solid var(--line);background:white;border-radius:14px;cursor:pointer}.week-label{text-align:center;font-weight:850;font-size:14px}.week-label button{width:auto;height:auto;border:0;background:transparent;text-decoration:underline;font-size:11px;color:var(--muted)}
    .day-grid{display:grid;gap:9px}.day-card{display:grid;grid-template-columns:56px 1fr auto;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:white;border-radius:18px;padding:12px;cursor:pointer}.day-card.selected{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}.day-card.today .day-badge{background:var(--accent);color:white}.day-badge{width:45px;height:49px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:900;line-height:1.05;text-transform:uppercase}.day-badge b{font-size:18px}.day-name{font-weight:850;font-size:15px}.day-meta{font-size:11px;color:var(--muted);margin-top:4px}.day-progress{font-size:12px;font-weight:850;color:var(--muted)}
    .preview{margin-top:14px;padding:18px}.preview ul{padding-left:20px;margin:10px 0 16px}.preview li{margin:7px 0;color:var(--muted);font-size:14px}
    .progress-controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.select{height:48px;border:1px solid var(--line);border-radius:14px;background:white;padding:0 38px 0 13px;font-weight:750;color:var(--ink)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{padding:14px 12px}.stat span{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:7px}.stat strong{font-size:20px;letter-spacing:-.04em}.stat small{font-size:10px;color:var(--muted)}
    .chart-card{padding:16px;margin-bottom:12px;overflow:hidden}.chart-card svg{display:block;width:100%;height:auto}.chart-grid{stroke:var(--line);stroke-width:1}.chart-line{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.chart-point{fill:white;stroke:var(--accent);stroke-width:3}.chart-label{font-size:10px;fill:var(--muted)}
    .history-list{display:grid;gap:8px}.history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px}.history-row b{font-size:14px}.history-row span{font-size:12px;color:var(--muted)}.history-button{width:100%;text-align:left;cursor:pointer;color:var(--ink)}
    .data-card{padding:18px;margin-top:22px}.data-card h2{margin-bottom:6px}.data-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.danger{color:#a01a32;border-color:#efbcc6}
    .empty{padding:30px 18px;text-align:center;color:var(--muted)}
    .back-row{margin:0 0 10px}.back-row button{border:0;background:transparent;padding:6px 0;font-weight:850;cursor:pointer}
    .bottom-nav{position:fixed;z-index:40;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,780px);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:7px 11px env(safe-area-inset-bottom);background:rgba(255,255,255,.94);backdrop-filter:blur(22px);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 -12px 30px rgba(20,23,20,.08)}
    .nav-btn{border:0;background:transparent;border-radius:16px;display:grid;place-items:center;align-content:center;gap:4px;min-height:58px;color:var(--muted);font-size:11px;font-weight:850;cursor:pointer}.nav-btn .nav-icon{font-size:20px;line-height:1}.nav-btn.active{background:#f9e8ec;color:var(--accent-dark)}
    .toast{position:fixed;z-index:100;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);transform:translate(-50%,20px);width:min(calc(100% - 32px),420px);padding:13px 16px;border-radius:15px;background:var(--ink);color:white;font-size:13px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    @media(min-width:700px){main{padding-top:28px}.today-layout{display:grid;grid-template-columns:310px 1fr;align-items:start;gap:14px}.today-layout .muscle-card{position:sticky;top:86px}.body-stage{width:90%}.hero{padding:30px}.day-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:340px){main{padding-left:10px;padding-right:10px}.hero{padding:20px}.stats{grid-template-columns:1fr}.progress-controls{grid-template-columns:1fr}.set-row{grid-template-columns:47px minmax(0,1fr) 45px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
    @media print{.topbar,.bottom-nav,.detail-actions,.segmented,.privacy-chip{display:none!important}.app{padding:0}main{width:100%}.card{box-shadow:none}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>TRAIN</div>
      <div class="privacy-chip">Saved on this device</div>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-btn active" data-action="nav" data-view="today"><span class="nav-icon" aria-hidden="true">●</span><span>Today</span></button>
      <button class="nav-btn" data-action="nav" data-view="schedule"><span class="nav-icon" aria-hidden="true">▦</span><span>Schedule</span></button>
      <button class="nav-btn" data-action="nav" data-view="progress"><span class="nav-icon" aria-hidden="true">↗</span><span>Progress</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="import-file" class="sr-only" type="file" accept="application/json,.json">
  <noscript><p style="padding:24px">Train requires JavaScript to save workouts and draw progress.</p></noscript>
  <script>
  (() => {
    'use strict';

    const STORAGE_KEY = 'train-workout-data-v1';
    const ABS_URL = 'https://fitbod.me/exercises/abs';

      if(action==='nav'){goView(target.dataset.view);return}
      if(action==='body-view'){state.bodyFacing=target.dataset.facing;render();return}
      if(action==='expand'){const id=target.dataset.exercise;state.expanded=state.expanded===id?null:id;state.selectedExercise=state.expanded?id:null;render();return}
      if(action==='select-check'){state.selectedExercise=state.selectedExercise===target.dataset.exercise?null:target.dataset.exercise;render();return}
      if(action==='back-today'){state.activeDate=null;state.expanded=null;state.selectedExercise=null;state.autoExpandedDate=null;render();return}
      if(action==='add-set'){
        const item=findExercise(target.dataset.exercise);mutateSession(target.dataset.date,s=>{const log=ensureLog(s,item);if(log.sets.length<20)log.sets.push({weightKg:null,complete:false})});return;
      }
      if(action==='remove-set'){
        const item=findExercise(target.dataset.exercise),session=sessionFor(target.dataset.date),sets=session?.exercises?.[item.id]?.sets||[];if(!sets.length)return;const last=sets.at(-1);if((last.complete||last.weightKg)&&!confirm('Remove the last filled set?'))return;mutateSession(target.dataset.date,s=>ensureLog(s,item).sets.pop());return;
      }
      if(action==='copy-weight'){
        const item=findExercise(target.dataset.exercise);mutateSession(target.dataset.date,s=>{const sets=ensureLog(s,item).sets;const weight=Number(sets[0]?.weightKg);if(!(weight>0)){toast('Enter the first set weight first.');return}sets.forEach(set=>set.weightKg=weight)});return;
      }
      if(action==='week-prev'){state.weekStart=addDays(state.weekStart,-7);state.scheduleDate=isoDate(state.weekStart);render();return}
      if(action==='week-next'){state.weekStart=addDays(state.weekStart,7);state.scheduleDate=isoDate(state.weekStart);render();return}
      if(action==='week-current'){state.weekStart=startOfWeek(new Date());state.scheduleDate=isoDate(new Date());render();return}
      if(action==='schedule-date'){state.scheduleDate=target.dataset.date;render();return}
      if(action==='open-date'){state.activeDate=target.dataset.date;state.view='today';state.expanded=null;state.selectedExercise=null;state.autoExpandedDate=null;render();window.scrollTo({top:0,behavior:'smooth'});return}
      if(action==='export'){exportData();return}
      if(action==='import'){document.getElementById('import-file').click();return}
      if(action==='reset'){if(confirm('Delete every saved workout from this browser?')&&confirm('This cannot be undone. Export first if you need a backup.')){data={schemaVersion:1,sessions:{}};saveData();render();toast('All workout data was reset.')}return}
    });

    document.addEventListener('change',event=>{
      const input=event.target;
      if(input.matches('[data-check-item]')){const item=findExercise(input.dataset.checkItem);mutateSession(input.dataset.date,s=>ensureLog(s,item).complete=input.checked);return}
      if(input.matches('[data-set-check]')){
        const item=findExercise(input.dataset.setCheck),index=Number(input.dataset.set),session=sessionFor(input.dataset.date),set=session?.exercises?.[item.id]?.sets?.[index];
        if(input.checked&&item.type==='weighted'&&!(Number(set?.weightKg)>0)){input.checked=false;toast('Enter a valid weight before completing this set.');return}
        mutateSession(input.dataset.date,s=>ensureLog(s,item).sets[index].complete=input.checked);return;
      }
      if(input.id==='progress-exercise'){state.progressExercise=input.value;render();return}
      if(input.id==='progress-filter'){state.filter=input.value;render();return}
    });
    document.addEventListener('input',event=>{
      const input=event.target;if(!input.matches('.weight-input'))return;const item=findExercise(input.dataset.exercise),index=Number(input.dataset.set);const raw=input.value.trim();const weight=raw===''?null:Number(raw);
      if(weight!==null&&(!Number.isFinite(weight)||weight<=0||weight>1000)){input.setAttribute('aria-invalid','true');return}else input.removeAttribute('aria-invalid');
      mutateSession(input.dataset.date,s=>{const set=ensureLog(s,item).sets[index];set.weightKg=weight;if(weight===null)set.complete=false},false);
    });
    document.getElementById('import-file').addEventListener('change',async event=>{
      const file=event.target.files?.[0];event.target.value='';if(!file)return;
      try{const parsed=JSON.parse(await file.text());if(parsed?.schemaVersion!==1||!parsed.sessions||typeof parsed.sessions!=='object'||Array.isArray(parsed.sessions))throw new Error('Invalid backup');if(!confirm(`Replace current history with ${Object.keys(parsed.sessions).length} saved sessions?`))return;data=parsed;saveData();render();toast('Workout history imported.')}catch(err){toast('That file is not a valid Train backup.')}
    });
    function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`train-backup-${isoDate(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded.')}
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.view==='today'&&!state.activeDate)render()});

    render();
  })();
  </script>
</body>
</html>
